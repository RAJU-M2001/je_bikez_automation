
name: JE BikeZ Homepage Automation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-automation:
    name: Homepage Automation and Slack Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      TEST_ENVIRONMENT: prod
      PYTHONUNBUFFERED: "1"

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install playwright requests

      # 4. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      # 5. Run homepage automation
      - name: Run Homepage Tests
        id: homepage_test
        continue-on-error: true
        run: |
          python -m web_automation.main --test home

      # 6. Generate screenshot from HTML report
      - name: Generate HTML Report Screenshot
        id: report_screenshot
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          report = Path(
              "web_automation/reports/prod/pytest_Report.html"
          ).resolve()

          screenshot = Path(
              "web_automation/reports/prod/pytest_Report_preview.png"
          ).resolve()

          if not report.is_file():
              raise FileNotFoundError(
                  f"HTML report not found: {report}"
              )

          screenshot.parent.mkdir(parents=True, exist_ok=True)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  viewport={"width": 1440, "height": 1000},
                  device_scale_factor=1
              )

              page.goto(
                  report.as_uri(),
                  wait_until="load",
                  timeout=60000
              )
              page.screenshot(
                  path=str(screenshot),
                  full_page=True,
                  animations="disabled"
              )
              browser.close()

          print(f"Screenshot generated: {screenshot}")
          print(f"Screenshot size: {screenshot.stat().st_size} bytes")
          PY

      # 7. Verify screenshot
      - name: Verify Report Screenshot
        id: verify_screenshot
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path

          screenshot = Path(
              "web_automation/reports/prod/pytest_Report_preview.png"
          )

          if not screenshot.is_file():
              raise FileNotFoundError(
                  f"Screenshot not found: {screenshot}"
              )

          if screenshot.stat().st_size == 0:
              raise RuntimeError("Screenshot is empty.")

          with screenshot.open("rb") as f:
              signature = f.read(8)

          if signature != b"\x89PNG\r\n\x1a\n":
              raise RuntimeError("Screenshot is not a valid PNG.")

          print("Screenshot verification: SUCCESS")
          print(f"File size: {screenshot.stat().st_size} bytes")
          PY

      # 8. Upload reports as GitHub artifacts
      - name: Upload Automation Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: je-bikez-automation-reports
          path: |
            web_automation/reports/prod/automation_report.xlsx
            web_automation/reports/prod/pytest_Report.html
            web_automation/reports/prod/pytest_Report_preview.png
          if-no-files-found: warn
          retention-days: 14

      # 9. Verify Slack channel access
      - name: Verify Slack Channel Access
        id: slack_channel_check
        if: always()
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["SLACK_BOT_TOKEN"].strip()
          channel_id = os.environ["SLACK_CHANNEL_ID"].strip()

          headers = {"Authorization": f"Bearer {token}"}

          response = requests.get(
              "https://slack.com/api/conversations.info",
              headers=headers,
              params={"channel": channel_id},
              timeout=30,
          )
          response.raise_for_status()
          result = response.json()

          print("Channel lookup successful:", result.get("ok"))
          print("Channel lookup error:", result.get("error", "none"))

          if result.get("ok"):
              print("Channel name:", result["channel"].get("name"))
              print("Channel ID matches.")
              raise SystemExit(0)

          if result.get("error") != "channel_not_found":
              raise SystemExit(
                  f"Slack API returned: {result.get('error')}"
              )

          print("Searching channels visible to the bot...")

          cursor = None
          found = False

          while True:
              params = {
                  "types": "public_channel,private_channel",
                  "limit": 200,
                  "exclude_archived": "true",
              }

              if cursor:
                  params["cursor"] = cursor

              listing_response = requests.get(
                  "https://slack.com/api/conversations.list",
                  headers=headers,
                  params=params,
                  timeout=30,
              )
              listing_response.raise_for_status()
              listing = listing_response.json()

              if not listing.get("ok"):
                  print("Channel list error:", listing.get("error"))
                  raise SystemExit(1)

              for channel in listing.get("channels", []):
                  if channel.get("name") == "je_report":
                      print("Found channel name: je_report")
                      print("Actual channel ID:", channel.get("id"))
                      print(
                          "Is private:",
                          channel.get("is_private", False)
                      )
                      found = True

              cursor = (
                  listing.get("response_metadata", {}).get("next_cursor")
              )

              if not cursor:
                  break

          if not found:
              print(
                  "je_report is not visible to this bot. "
                  "Check workspace, channel membership, and scopes."
              )
              raise SystemExit(1)
          PY

      # 10. Upload screenshot to Slack
      - name: Send Report Screenshot to Slack
        id: slack_upload
        if: always() && steps.verify_screenshot.outcome == 'success' && steps.slack_channel_check.outcome == 'success'
        uses: slackapi/slack-github-action@v3
        continue-on-error: true
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel_id: "${{ secrets.SLACK_CHANNEL_ID }}"
            file: "web_automation/reports/prod/pytest_Report_preview.png"
            filename: "pytest_Report_preview.png"
            title: "JE BikeZ Homepage Automation Report"
            initial_comment: "JE BikeZ homepage automation report screenshot. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # 11. Print Slack upload diagnostics
      - name: Debug Slack Upload Response
        if: always()
        env:
          SLACK_UPLOAD_OUTCOME: ${{ steps.slack_upload.outcome }}
          SLACK_UPLOAD_OK: ${{ steps.slack_upload.outputs.ok }}
          SLACK_UPLOAD_RESPONSE: ${{ steps.slack_upload.outputs.response }}
          SLACK_CHANNEL_CHECK_OUTCOME: ${{ steps.slack_channel_check.outcome }}
        run: |
          echo "Slack channel verification outcome: $SLACK_CHANNEL_CHECK_OUTCOME"
          echo "Slack upload step outcome: $SLACK_UPLOAD_OUTCOME"
          echo "Slack API ok: $SLACK_UPLOAD_OK"
          echo "Slack API response:"
          echo "$SLACK_UPLOAD_RESPONSE"

      # 12. Send text notification through the existing webhook
      - name: Send Slack Text Notification
        if: always()
        uses: slackapi/slack-github-action@v3
        continue-on-error: true
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_01 }}
          payload: |
            {
              "text": "JE BikeZ Homepage Automation\nTest result: ${{ steps.homepage_test.outcome }}\nScreenshot generation: ${{ steps.report_screenshot.outcome }}\nScreenshot verification: ${{ steps.verify_screenshot.outcome }}\nChannel verification: ${{ steps.slack_channel_check.outcome }}\nSlack upload step: ${{ steps.slack_upload.outcome }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      # 13. Final test status
      - name: Final Test Status
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.homepage_test.outcome }}
        run: |
          if [ "$TEST_OUTCOME" != "success" ]; then
            echo "Homepage automation failed."
            exit 1
          fi

          echo "Homepage automation passed."
