
name: JE BikeZ Homepage Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-test:
    name: Run Homepage Tests
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENVIRONMENT: prod

    steps:
      # 1. Checkout the automation repository
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright and Chromium
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # 5. Run the existing homepage automation
      - name: Run JE BikeZ Homepage Test
        id: homepage_test
        continue-on-error: true
        run: |
          python -m web_automation.main --test home

      # 6. Generate a screenshot of the HTML report
      - name: Capture HTML Report Screenshot
        id: report_screenshot
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          report = Path(
              "web_automation/reports/prod/pytest_Report.html"
          ).resolve()

          screenshot = Path(
              "web_automation/reports/prod/pytest_Report_preview.png"
          )

          if not report.is_file():
              raise FileNotFoundError(
                  f"HTML report not found: {report}"
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 1000},
                  device_scale_factor=1
              )

              page.goto(report.as_uri(), wait_until="load")
              page.screenshot(
                  path=str(screenshot),
                  full_page=True
              )

              browser.close()

          print(f"Report screenshot created: {screenshot}")
          PY

      # 7. Upload reports to GitHub Actions artifacts
      - name: Upload Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: je-bikez-homepage-reports
          path: |
            web_automation/reports/prod/automation_report.xlsx
            web_automation/reports/prod/pytest_Report.html
            web_automation/reports/prod/pytest_Report_preview.png
          if-no-files-found: warn
          retention-days: 14

      # 8. Upload the screenshot directly to Slack
      - name: Send Report Screenshot to Slack
        if: >-
          always() &&
          steps.report_screenshot.outcome == 'success' &&
          hashFiles('web_automation/reports/prod/pytest_Report_preview.png') != '' &&
          env.SLACK_BOT_TOKEN != '' &&
          env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            file: web_automation/reports/prod/pytest_Report_preview.png
            filename: pytest_Report_preview.png
            title: JE BikeZ Homepage Automation Report
            initial_comment: "JE BikeZ Homepage Automation - HTML report screenshot. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # 9. Keep the existing Slack webhook text notification
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_01 }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              JE BikeZ Homepage Automation: ${{ steps.homepage_test.outcome }}
              Screenshot step: ${{ steps.report_screenshot.outcome }}
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Commit: ${{ github.sha }}
              Run and download reports: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 10. Fail the workflow if the homepage test failed
      - name: Final Test Status
        if: always()
        run: |
          if [ "${{ steps.homepage_test.outcome }}" != "success" ]; then
            echo "Homepage automation failed."
            exit 1
          fi

          echo "Homepage automation passed."
