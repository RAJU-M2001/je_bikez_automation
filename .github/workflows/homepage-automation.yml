
name: JE BikeZ Homepage Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-test:
    name: Run Homepage Tests
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENVIRONMENT: prod

    steps:
      # 1. Checkout repository
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      # 2. Configure Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # 3. Install dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # 5. Run homepage automation
      - name: Run JE BikeZ Homepage Test
        id: homepage_test
        continue-on-error: true
        run: |
          python -m web_automation.main --test home

      # 6. Generate screenshot from HTML report
      - name: Capture HTML Report Screenshot
        id: report_screenshot
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          report = Path(
              "web_automation/reports/prod/pytest_Report.html"
          ).resolve()

          screenshot = Path(
              "web_automation/reports/prod/pytest_Report_preview.png"
          )

          if not report.is_file():
              raise FileNotFoundError(
                  f"HTML report not found: {report}"
              )

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(
                  viewport={"width": 1440, "height": 1000},
                  device_scale_factor=1
              )

              page.goto(report.as_uri(), wait_until="load")
              page.screenshot(
                  path=str(screenshot),
                  full_page=True
              )

              browser.close()

          if not screenshot.is_file() or screenshot.stat().st_size == 0:
              raise RuntimeError("Screenshot was not generated correctly.")

          print(f"Screenshot: {screenshot}")
          print(f"Size: {screenshot.stat().st_size} bytes")
          PY

      # 7. Verify the generated screenshot
      - name: Verify Report Screenshot
        id: verify_screenshot
        if: always()
        run: |
          FILE="web_automation/reports/prod/pytest_Report_preview.png"

          if [ ! -s "$FILE" ]; then
            echo "::error::Screenshot is missing or empty: $FILE"
            find web_automation/reports -type f -print || true
            exit 1
          fi

          ls -lh "$FILE"
          file "$FILE"

      # 8. Upload reports to GitHub Actions artifacts
      - name: Upload Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: je-bikez-homepage-reports
          path: |
            web_automation/reports/prod/automation_report.xlsx
            web_automation/reports/prod/pytest_Report.html
            web_automation/reports/prod/pytest_Report_preview.png
          if-no-files-found: warn
          retention-days: 14

      # 9. Upload screenshot to the Slack channel
      - name: Send Report Screenshot to Slack
        id: slack_upload
        if: always() && steps.verify_screenshot.outcome == 'success'
        uses: slackapi/slack-github-action@v2
        continue-on-error: true
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            {
              "channel_id": "${{ secrets.SLACK_CHANNEL_ID }}",
              "file": "web_automation/reports/prod/pytest_Report_preview.png",
              "filename": "pytest_Report_preview.png",
              "title": "JE BikeZ Homepage Automation Report",
              "initial_comment": "JE BikeZ Playwright HTML report screenshot. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      # 10. Preserve existing Slack webhook notification
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        continue-on-error: true
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_01 }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "JE BikeZ Homepage Automation: ${{ steps.homepage_test.outcome }}\nScreenshot generation: ${{ steps.report_screenshot.outcome }}\nScreenshot verification: ${{ steps.verify_screenshot.outcome }}\nSlack upload: ${{ steps.slack_upload.outcome }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nView run and download reports: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      # 11. Ensure the workflow reflects the actual test result
      - name: Final Test Status
        if: always()
        run: |
          if [ "${{ steps.homepage_test.outcome }}" != "success" ]; then
            echo "::error::Homepage automation failed."
            exit 1
          fi

          echo "Homepage automation passed."
