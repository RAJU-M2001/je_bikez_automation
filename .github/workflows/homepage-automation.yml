
name: JE BikeZ Homepage Automation

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  homepage-test:
    name: Run Homepage Tests
    runs-on: ubuntu-latest

    env:
      CI: "true"
      TEST_ENVIRONMENT: prod

    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run JE BikeZ Homepage Test
        run: |
          python -m web_automation.main --test home

      - name: Upload Automation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: je-bikez-homepage-reports
          path: |
            web_automation/reports/prod/automation_report.xlsx
            web_automation/reports/prod/pytest_Report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_01 }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "JE BikeZ Homepage Automation: ${{ job.status }}\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nView test results and download reports: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
